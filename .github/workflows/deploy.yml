# Har safar main branchiga push qilinganda saytni build qiladi va tayyor
# natijani "deploy" branchiga yozadi. Plesk shu branchni webhook orqali
# tortib oladi (serverda npm install / build kerak emas).
name: Build and publish to deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Enable standalone output
        run: |
          grep -q 'output: "standalone"' next.config.ts || \
            sed -i 's/const nextConfig: NextConfig = {/const nextConfig: NextConfig = {\n  output: "standalone",/' next.config.ts
          grep -q 'output: "standalone"' next.config.ts

      - run: npm run build

      - name: Assemble bundle
        run: |
          rm -rf bundle && mkdir bundle
          cp -r .next/standalone/. bundle/
          mkdir -p bundle/.next bundle/public bundle/data
          cp -r .next/static bundle/.next/static
          cp -r public/. bundle/public/
          cp data/content.default.json bundle/data/
          # admin panel yozadigan fayllar deploy branchiga kirmasin
          rm -f bundle/data/content.json
          find bundle/public/uploads -mindepth 1 ! -name .gitkeep -delete 2>/dev/null || true
          # server glibc Linux — musl kutubxonalari kerak emas
          rm -rf bundle/node_modules/@img/*linuxmusl*
          mv bundle/server.js bundle/standalone-server.js
          cat > bundle/app.cjs <<'EOF'
          // Plesk / Passenger startup file for the prebuilt (standalone) Next.js app.
          process.env.NODE_ENV = "production";
          process.env.HOSTNAME = "0.0.0.0";
          require("./standalone-server.js");
          EOF
          test -f bundle/standalone-server.js
          test -d bundle/.next/static
          du -sh bundle

      - name: Publish to deploy branch
        run: |
          cd bundle
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
